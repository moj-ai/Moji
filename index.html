
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#091522">

<title>موج AI | دستیار هوشمند</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #091522;
  color: #edf5ff;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* سربرگ */

header {
  background: #102438;
  padding: 13px 15px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid #20384b;
}

.logo {
  width: 47px;
  height: 47px;
  border-radius: 15px;
  background: linear-gradient(135deg,#00d5d8,#1263a5);
  display: grid;
  place-items: center;
  font-size: 27px;
  box-shadow: 0 4px 15px #00b9c533;
}

.header-text {
  flex: 1;
}

.header-text h2 {
  margin: 0 0 5px;
  font-size: 18px;
}

.status {
  color: #43d9a3;
  font-size: 11px;
}

.clear-btn {
  background: #263d50;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 10px;
  font-size: 11px;
}

/* صفحه گفتگو */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 17px 13px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  scroll-behavior: smooth;
}

.welcome {
  text-align: center;
  margin: auto 0;
  color: #b9cbd9;
  line-height: 2;
}

.wave {
  font-size: 58px;
}

.welcome h3 {
  color: white;
  font-size: 23px;
  margin: 5px;
}

.welcome p {
  font-size: 13px;
}

.message {
  max-width: 88%;
  padding: 13px 15px;
  border-radius: 16px;
  line-height: 2;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #172d40;
  border-bottom-right-radius: 4px;
}

.user {
  align-self: flex-end;
  background: #087e91;
  border-bottom-left-radius: 4px;
}

.message-time {
  font-size: 10px;
  color: #a6bdcc;
  margin-top: 5px;
  opacity: .7;
}

/* پیشنهادها */

.suggestions {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 12px;
  scrollbar-width: none;
}

.suggestions button {
  white-space: nowrap;
  background: #172d40;
  border: 1px solid #29445b;
  color: #d9efff;
  border-radius: 20px;
  padding: 10px 13px;
  font-size: 11px;
}

/* قسمت ارسال پیام */

footer {
  background: #102438;
  padding: 12px;
  border-top: 1px solid #20384b;
}

.input-area {
  display: flex;
  gap: 8px;
  align-items: center;
}

input {
  flex: 1;
  min-width: 0;
  background: #1b3043;
  color: white;
  border: 1px solid #345069;
  border-radius: 14px;
  padding: 14px;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #00bdc9;
}

.action-btn {
  min-width: 46px;
  height: 46px;
  border: 0;
  border-radius: 13px;
  background: #087e91;
  color: white;
  font-size: 20px;
}

.send-btn {
  background: #00a9b8;
}

.voice-btn {
  background: #24445d;
}

.voice-btn.active {
  background: #d34d5b;
}

.note {
  text-align: center;
  font-size: 10px;
  color: #8199ad;
  margin-top: 9px;
}

.voice-tools {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 10px;
}

.voice-tools button {
  background: transparent;
  border: 1px solid #345069;
  color: #b9d4e6;
  padding: 7px 11px;
  border-radius: 10px;
  font-size: 11px;
}

button {
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

</style>
</head>

<body>

<header>

  <div class="logo">🌊</div>

  <div class="header-text">
    <h2>موج AI</h2>
    <div class="status" id="status">
      ● آماده به کار | نسخه رایگان
    </div>
  </div>

  <button class="clear-btn" onclick="clearHistory()">
    🗑 پاک کردن
  </button>

</header>

<main id="chat">

  <div class="welcome" id="welcome">
    <div class="wave">🌊</div>
    <h3>به موج AI خوش آمدی</h3>
    <p>
      من دستیار هوشمند شخصی تو هستم.<br>
      چه کاری می‌توانم برایت انجام دهم؟
    </p>
  </div>

</main>

<div class="suggestions">

  <button onclick="suggest('سلام موج AI')">
    👋 سلام
  </button>

  <button onclick="suggest('خودت را معرفی کن')">
    🤖 معرفی خودت
  </button>

  <button onclick="suggest('پایتون را به من آموزش بده')">
    🐍 آموزش پایتون
  </button>

  <button onclick="suggest('درباره تأسیسات ساختمان توضیح بده')">
    🔧 تأسیسات
  </button>

  <button onclick="readLastAnswer()">
    🔊 خواندن پاسخ
  </button>

</div>

<footer>

  <div class="input-area">

    <button
      class="action-btn voice-btn"
      id="micButton"
      onclick="startVoice()">
      🎤
    </button>

    <input
      id="message"
      type="text"
      placeholder="پیامت را بنویس..."
      autocomplete="off"
      onkeydown="if(event.key==='Enter') sendMessage()">

    <button
      class="action-btn send-btn"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div class="voice-tools">

    <button onclick="stopSpeaking()">
      ⏹ توقف صدا
    </button>

    <button onclick="testVoice()">
      🔈 آزمایش صدا
    </button>

  </div>

  <div class="note">
    موج AI | دستیار شخصی تو
  </div>

</footer>

<script>

/* -------------------------
   1. تنظیمات اولیه
-------------------------- */

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const micButton = document.getElementById("micButton");

const STORAGE_KEY = "moj_ai_history";

let history = [];
let recognition = null;
let listening = false;

/* -------------------------
   2. بارگذاری تاریخچه
-------------------------- */

try {
  history = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if (!Array.isArray(history)) {
    history = [];
  }

} catch (error) {
  history = [];
}

function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history)
    );
  } catch (error) {
    console.error("خطا در ذخیره تاریخچه:", error);
  }
}

/* -------------------------
   3. نمایش پیام
-------------------------- */

function addMessage(text, type, save = true) {

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const div = document.createElement("div");
  div.className = "message " + type;

  const content = document.createElement("div");
  content.textContent = text;

  const time = document.createElement("div");
  time.className = "message-time";
  time.textContent = new Date().toLocaleTimeString(
    "fa-IR",
    { hour: "2-digit", minute: "2-digit" }
  );

  div.appendChild(content);
  div.appendChild(time);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    history.push({
      text: text,
      type: type
    });

    saveHistory();
  }
}

/* -------------------------
   4. دانش اولیه موج
-------------------------- */

const knowledge = [

  {
    words: ["سلام", "درود", "صبح بخیر"],
    answer: "سلام! 🌊 خوش آمدی. من موج AI هستم. چطور می‌توانم کمکت کنم؟"
  },

  {
    words: ["اسمت", "نامت", "معرفی"],
    answer: "من موج AI هستم؛ دستیار هوشمند شخصی تو. هدفم این است که به مرور امکانات بیشتری پیدا کنم."
  },

  {
    words: ["پایتون", "برنامه نویسی", "برنامه‌نویسی"],
    answer: "پایتون یک زبان برنامه‌نویسی ساده و قدرتمند است. 🐍 می‌توانیم از صفر شروع کنیم و مرحله به مرحله جلو برویم."
  },

  {
    words: ["تأسیسات", "تاسیسات", "لوله کشی", "لوله‌کشی"],
    answer: "تأسیسات ساختمان شامل آب، فاضلاب، گرمایش و سرمایش است. دوست داری درباره کدام بخش بیشتر بدانی؟"
  },

  {
    words: ["کولر", "اسپلیت"],
    answer: "برای عیب‌یابی کولر اسپلیت باید برق، خازن، کمپرسور، فن، فیلترها و وضعیت مبرد بررسی شوند. مدل دستگاه و نشانه خرابی را بگو."
  },

  {
    words: ["ممنون", "مرسی", "تشکر"],
    answer: "خواهش می‌کنم! 😊 خوشحالم که توانستم کمکت کنم."
  },

  {
    words: ["خداحافظ", "فعلا", "فعلاً"],
    answer: "به امید دیدار! 🌊 هر وقت برگشتی من اینجا هستم."
  },

  {
    words: ["ساعت", "زمان"],
    answer: "ساعت فعلی دستگاهت: " +
      new Date().toLocaleTimeString("fa-IR")
  },

  {
    words: ["حالت چطوره", "خوبی"],
    answer: "من آماده به کارم و منتظر سؤال‌های تو هستم! 🌊"
  }

];

/* -------------------------
   5. تولید پاسخ
-------------------------- */

function getReply(message) {

  const text = message.toLowerCase().trim();

  for (const item of knowledge) {

    if (
      item.words.some(word => text.includes(word))
    ) {
      return item.answer;
    }

  }

  return "پیامت را دریافت کردم. 🌊\n\nهنوز پاسخ این موضوع را یاد نگرفته‌ام. می‌توانی سؤال را با جزئیات بیشتری مطرح کنی.";
}

/* -------------------------
   6. ارسال پیام
-------------------------- */

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  stopSpeaking();

  addMessage(text, "user");

  input.value = "";

  statusText.textContent = "● در حال پاسخ‌گویی...";

  setTimeout(() => {

    const answer = getReply(text);

    addMessage(answer, "bot");

    statusText.textContent = "● آماده به کار";

    speak(answer);

  }, 400);

}

/* -------------------------
   7. پیشنهادهای آماده
-------------------------- */

function suggest(text) {

  input.value = text;

  sendMessage();

}

/* -------------------------
   8. ذخیره و بازیابی
-------------------------- */

function loadHistory() {

  history.forEach(item => {

    if (
      item &&
      typeof item.text === "string" &&
      (item.type === "user" || item.type === "bot")
    ) {

      addMessage(item.text, item.type, false);

    }

  });

}

/* -------------------------
   9. پاک کردن تاریخچه
-------------------------- */

function clearHistory() {

  const confirmDelete = confirm(
    "آیا مطمئنی می‌خواهی تمام گفتگوها پاک شوند؟"
  );

  if (!confirmDelete) return;

  history = [];

  localStorage.removeItem(STORAGE_KEY);

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="wave">🌊</div>
      <h3>به موج AI خوش آمدی</h3>
      <p>من دستیار هوشمند شخصی تو هستم.</p>
    </div>
  `;

  stopSpeaking();

}

/* -------------------------
   10. خواندن پاسخ با صدا
-------------------------- */

function speak(text) {

  if (!("speechSynthesis" in window)) {

    statusText.textContent = "● پخش صدا پشتیبانی نمی‌شود";

    return;

  }

  const synth = window.speechSynthesis;

  synth.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang = "fa-IR";
  voice.rate = 0.85;
  voice.pitch = 1;
  voice.volume = 1;

  const voices = synth.getVoices();

  const persianVoice = voices.find(v =>
    v.lang.toLowerCase().startsWith("fa")
  );

  if (persianVoice) {
    voice.voice = persianVoice;
  }

  voice.onstart = function() {
    statusText.textContent = "● در حال صحبت کردن...";
  };

  voice.onend = function() {
    statusText.textContent = "● آماده به کار";
  };

  voice.onerror = function(event) {
    statusText.textContent = "● مشکل در پخش صدا";
    console.error("Speech error:", event.error);
  };

  synth.speak(voice);

}

/* -------------------------
   11. خواندن آخرین پاسخ
-------------------------- */

function readLastAnswer() {

  const lastAnswer = [...history].reverse().find(
    item => item.type === "bot"
  );

  if (lastAnswer) {

    speak(lastAnswer.text);

  } else {

    speak("سلام! من موج AI هستم. خوش آمدی.");

  }

}

/* -------------------------
   12. توقف صدا
-------------------------- */

function stopSpeaking() {

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    statusText.textContent = "● آماده به کار";

  }

}

/* -------------------------
   13. آزمایش صدای فارسی
-------------------------- */

function testVoice() {

  speak(
    "سلام. من موج AI هستم. آزمایش صدای فارسی با موفقیت آغاز شد."
  );

}

/* -------------------------
   14. تشخیص گفتار
-------------------------- */

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "تشخیص گفتار در این مرورگر پشتیبانی نمی‌شود. لطفاً Chrome را امتحان کن."
    );

    return;

  }

  if (listening && recognition) {

    recognition.stop();

    return;

  }

  recognition = new SpeechRecognition();

  recognition.lang = "fa-IR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {

    listening = true;

    micButton.classList.add("active");

    micButton.textContent = "⏹";

    input.placeholder = "دارم گوش می‌دهم...";

    statusText.textContent = "● در حال شنیدن صدای تو...";

  };

  recognition.onresult = function(event) {

    const result =
      event.results[0][0].transcript;

    input.value = result;

    input.focus();

    statusText.textContent = "● گفتار به متن تبدیل شد";

  };

  recognition.onerror = function(event) {

    console.error("Recognition error:", event.error);

    statusText.textContent = "● خطا در دریافت صدا";

  };

  recognition.onend = function() {

    listening = false;

    micButton.classList.remove("active");

    micButton.textContent = "🎤";

    input.placeholder = "پیامت را بنویس...";

  };

  try {

    recognition.start();

  } catch (error) {

    alert("میکروفون در حال استفاده است یا امکان شروع آن وجود ندارد.");

  }

}

/* -------------------------
   15. شروع برنامه
-------------------------- */

loadHistory();

if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
}

</script>

</body>
</html>
